<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — ChullaCine</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">ChullaCine</a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="services.html">Cartelera</a></li>
          <li><a href="showtime.html">Funciones</a></li>
          <li><a href="offers.html">Ofertas</a></li>
          <li><a href="about.html">Acerca</a></li>
          <li><a href="contact.html" class="active">Contacto</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <input class="search" type="search" placeholder="Buscar...">
        <a class="button small" href="sesion.html">Iniciar sesión</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Contacto</h1>
    <p class="muted">Escríbenos, te responderemos pronto.</p>

    <div style="display: grid; grid-template-columns: 1fr 300px; gap: 30px; margin: 30px 0;">
      <form method="get" action="contact.html" class="card">
        <label>Nombre</label>
        <input type="text" name="nombre" placeholder="Tu nombre" required>
        
        <label>Correo</label>
        <input type="email" name="email" placeholder="correo@ejemplo.com" required>
        
        <label>Película de interés</label>
        <input type="text" name="pelicula" placeholder="¿Qué quieres ver?">
        
        <label>Mensaje</label>
        <textarea rows="4" name="mensaje" placeholder="Déjanos tu mensaje" required></textarea>
        
        <button class="button" type="submit" style="margin-top: 16px;">Enviar consulta</button>
      </form>

      <div class="card">
        <h3>Horarios</h3>
        <table style="width:100%; border-collapse: collapse;">
          <tr><td style="padding: 6px 0;">Neon Genesis</td><td class="muted">16:00 • 19:30 • 22:00</td></tr>
          <tr><td style="padding: 6px 0;">Love & Lights</td><td class="muted">14:45 • 18:00</td></tr>
          <tr><td style="padding: 6px 0;">Family Tales</td><td class="muted">11:00 • 13:30</td></tr>
        </table>
        <p class="muted" style="margin-top: 16px;">📍 Av. Cinematográfica 123</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">© 2026 ChullaCine</div>
  </footer>
</body>
</html>
